name: Publish
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DEV_RESOURCES_VERSION: 1.7
  MAVEN_OPTS: "-XX:CompressedClassSpaceSize=256m -XX:+UseSerialGC -Xmx2g -XX:MaxMetaspaceSize=512m"
jobs:
  publish:
    # The runner label this job asked for was retired years ago, so it has not
    # run since; the first push to master that can actually reach a runner would
    # otherwise publish without anyone deciding to. Publishing stays off until a
    # committer sets the PUBLISH_ON_MASTER repository variable to true, which
    # should happen once the org.locationtech namespace is granted on the Central
    # Portal and SONATYPE_USERNAME/SONATYPE_PASSWORD hold a Portal user token.
    # Until then a committer can still publish deliberately with Run workflow.
    # Only master reads PUBLISH_ON_MASTER. 2.x-jdk8's copy of this workflow
    # reads PUBLISH_ON_2X_JDK8, so turning on one branch's releases does not
    # start publishing from the other.
    if: >-
      github.repository == 'locationtech/geowave' &&
      (github.event_name == 'workflow_dispatch' || vars.PUBLISH_ON_MASTER == 'true')
    runs-on: ubuntu-24.04
    name: Publish Artifacts and Docs
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANGELOG_GITHUB_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
      GPG_OWNERTRUST: ${{ secrets.GPG_OWNERTRUST }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_SECRET_KEYS: ${{ secrets.GPG_SECRET_KEYS }}
      PYPI_CREDENTIALS: ${{ secrets.PYPI_CREDENTIALS }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven


    - name: Install Local Artifacts
      run: ./mvnw install -B -DskipTests -Dspotbugs.skip

    - name: Publish Artifacts
      run: ./.utility/publish-artifacts.sh

    - name: Publish Release Binaries
      run: ./.utility/publish-release-binaries.sh
      env:
        GH_REPO: ${{ github.repository }}

    - name: Generate Changelog
      uses: heinrichreimer/github-changelog-generator-action@v2.2
      with:
        issues: true
        issuesWoLabels: true
        pullRequests: true
        prWoLabels: true
        author: true
        unreleased: true
        stripGeneratorNotice: true
        verbose: true
        compareLink: true
        httpCache: true
        filterByMilestone: true

    - name: Convert Changelog to HTML
      uses: docker://pandoc/core:2.9
      with:
        args: "-f markdown -t html -s -c stylesheets/changelog.css -o changelog.html CHANGELOG.md"

    - name: Build HTML Docs
      run: ./mvnw -P html -pl docs install -DskipTests -Dspotbugs.skip

    - name: Build Aggregate Javadocs
      run: ./mvnw javadoc:aggregate -B -DskipTests -Dspotbugs.skip

    - name: Build Python Docs
      run: ./.utility/build-python-docs.sh

    - name: Publish Docs to GH-Pages
      run: ./.utility/publish-docs.sh

