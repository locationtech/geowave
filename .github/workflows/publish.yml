name: Publish
on:
  push:
    branches: [2.x-jdk8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DEV_RESOURCES_VERSION: 1.7
  MAVEN_OPTS: "-XX:CompressedClassSpaceSize=256m -XX:+UseSerialGC -Xmx2g -XX:MaxMetaspaceSize=512m"
jobs:
  publish:
    # Publishing from 2.x-jdk8 stays off until a committer sets the
    # PUBLISH_ON_2X_JDK8 repository variable to true; until then a committer can
    # still publish deliberately with Run workflow. The Central Portal token and
    # the signing key are the Eclipse Foundation-managed CENTRAL_SONATYPE_TOKEN_*
    # and GPG_* secrets. master's copy of this workflow reads PUBLISH_ON_MASTER
    # instead, so turning on one branch's releases does not start publishing from
    # the other.
    if: >-
      github.repository == 'locationtech/geowave' &&
      (github.event_name == 'workflow_dispatch' || vars.PUBLISH_ON_2X_JDK8 == 'true')
    runs-on: ubuntu-24.04
    name: Publish Artifacts and Docs
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANGELOG_GITHUB_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
      PYPI_CREDENTIALS: ${{ secrets.PYPI_CREDENTIALS }}
      CENTRAL_SONATYPE_TOKEN_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
      CENTRAL_SONATYPE_TOKEN_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
      # maven-gpg-plugin reads the passphrase from MAVEN_GPG_PASSPHRASE
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE_NEW }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Artifacts are still built and published on 8. The docs are not: asciidoctor
    # 2.x runs on JRuby 9.4, whose own dependencies (asm, joni, jcodings,
    # invokebinder, backport9) are Java 9 bytecode, so it cannot load on 8. 8 is
    # listed last so it stays the default JAVA_HOME and only the docs step opts
    # out.
    - name: Set up JDK 21 and JDK 8
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: |
          21
          8
        cache: maven
        # imports the signing key into the runner's keyring
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE


    - name: Install Local Artifacts
      run: ./mvnw install -B -DskipTests -Dspotbugs.skip

    - name: Publish Artifacts
      run: ./.utility/publish-artifacts.sh
    
    - name: Generate Changelog
      uses: heinrichreimer/github-changelog-generator-action@v2.2
      with:
        issues: true
        issuesWoLabels: true
        pullRequests: true
        prWoLabels: true
        author: true
        unreleased: true
        stripGeneratorNotice: true
        verbose: true
        compareLink: true
        httpCache: true
        filterByMilestone: true

    - name: Convert Changelog to HTML
      uses: docker://pandoc/core:2.9
      with:
        args: "-f markdown -t html -s -c stylesheets/changelog.css -o changelog.html CHANGELOG.md"

    - name: Build HTML Docs
      run: ./mvnw -P html -pl docs install -DskipTests -Dspotbugs.skip
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

    - name: Build Aggregate Javadocs
      run: ./mvnw javadoc:aggregate -B -DskipTests -Dspotbugs.skip

    - name: Build Python Docs
      run: ./.utility/build-python-docs.sh

    - name: Publish Docs to GH-Pages
      run: ./.utility/publish-docs.sh

