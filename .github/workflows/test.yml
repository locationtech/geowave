name: Tests

on:
  push:
    branches: [master]
  pull_request:
    # 'labeled' so that adding run-its to an open pull request actually starts
    # the integration matrix rather than waiting for the next push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Integration tests spin up real backends and take the bulk of the CI time, so
# they run on master, on demand, and on pull requests labelled 'run-its' --
# rather than on every push to every branch.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_RESOURCES_VERSION: 1.7
  MAVEN_PROFILES: '""'
  IT_ONLY: true
  MAVEN_OPTS: "-XX:CompressedClassSpaceSize=256m -XX:+UseSerialGC -Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    name: Unit Tests
    env:
      IT_ONLY: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run
        run: ./.utility/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: warn

  python-tests:
    runs-on: ubuntu-24.04
    name: Python Tests
    env:
      IT_ONLY: false
      PYTHON_BUILD: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run
        run: ./.utility/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-reports
          path: python/src/main/python/test-report.xml
          if-no-files-found: warn

  integration-tests:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-its')
    runs-on: ubuntu-24.04
    name: ${{ matrix.profile }} Integration Tests
    # Lanes listed under `include` with continue_on_error still run and still
    # report, but do not gate. The lane comments describe the Java 21 record as
    # of September 2026.
    continue-on-error: ${{ matrix.continue_on_error == true }}
    # Without a limit a hung lane runs to GitHub's six-hour ceiling before it reports,
    # which cassandra-it did on #1952 -- six hours to learn nothing. The first cap was
    # 90 minutes, on the basis that every lane which had ever passed finished in 34 to
    # 75. That reading was off, because a lane with a failing test stops early: once the
    # failures were fixed, filesystem-it took 88.6 minutes to pass and eight lanes were
    # cut off at the cap. 150 still turns a hang into a result well inside the ceiling.
    # It is now the Run step's timeout-minutes, and this one must stay above that, so
    # the step's timeout fires first and a lane that runs out of time fails rather
    # than being cancelled.
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        profile:
          - redis-it
          - rocksdb-it
          - hbase-it-client
          - hbase-it-server
          - 'filesystem-it,secondary-index-it'
          - 'rocksdb-it,secondary-index-it'
          - 'hbase-it-server,secondary-index-it'
        include:
          # Both Accumulo lanes fail intermittently, on a count in
          # GeoWaveBasicSpatialTemporalVectorIT or GeoWaveCustomCRSSpatialVectorIT
          # or on BAD_AUTHORIZATIONS in GeoWaveVisibilityIT, and so far a second
          # attempt has always passed. So each gets one retry (see the Run step)
          # and still gates: a deterministic break fails both attempts.
          - profile: accumulo-it-client
            retry_tests: true
          - profile: accumulo-it-server
            retry_tests: true
          # Fails often, each time on a count off by one (in a bulk delete, a
          # binned aggregation, GeoWaveCustomCRSSpatialVectorIT and
          # GeoWaveBasicSpatialTemporalVectorIT); the cause is not diagnosed. No
          # retry: a run takes one to two hours, so a failure and a second attempt
          # rarely fit in the Run step. The failures an earlier retry was hiding
          # were causes, not timing: the SecurityManager, jamm without its agent,
          # and CREATE TABLE on the driver's two-second default.
          - profile: cassandra-it
            continue_on_error: true
          # Fails occasionally, in GeoWaveCustomCRSSpatialVectorIT: a bulk delete
          # that left features behind, and a count aggregation that disagreed
          # with the query it counted. The cause is not understood, and the code
          # is due to be rewritten for AWS SDK v2, v1 having reached end of
          # support in December 2025.
          - profile: dynamodb-it
            continue_on_error: true
          # Made non-gating on the Java 8 line after GeoServerIngestIT got a 400
          # publishing the GridPoint layer. On Java 21 it has failed only on
          # #1953's first commits, which failed every lane, so it is the next
          # candidate to gate. The secondary-index filesystem lane gates either
          # way, so the store itself stays covered.
          - profile: filesystem-it
            continue_on_error: true
    env:
      IT_ONLY: true
      MAVEN_PROFILES: ${{ matrix.profile }}
      TEST_KERBEROS: ${{ matrix.test_kerberos }}
      RETRY_TESTS: ${{ matrix.retry_tests }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Not covered by setup-java's maven cache.
      - name: Cache downloaded test resources
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-other-${{ secrets.CACHE_ID }}
          restore-keys: ${{ runner.os }}-other-
          path: ~/.downloads

      # Keep timeout-minutes below the job's (see there). A retried lane's second
      # attempt starts however long the first took, and this timeout ends it if
      # need be; the step then fails and the reports still upload. That is the
      # cost of the retry: on a deterministic break it can spend up to about one
      # more lane's runtime, and in September 2026 an Accumulo attempt on master
      # took 38 to 85 minutes, so a retry after a slow failure may not finish.
      - name: Run
        timeout-minutes: 150
        env:
          RETRY_PRESERVE_DIRS: test/target/surefire-reports test/target/failsafe-reports
        run: ./.utility/retry ./.utility/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: it-reports-${{ strategy.job-index }}
          # test/pom.xml points failsafe's reportsDirectory at surefire-reports; failsafe-reports
          # holds only the summary. The XML is worth having: the log masks every "1" in it.
          # attempt-1 holds a retried lane's first attempt, moved there by .utility/retry.
          path: |
            test/target/surefire-reports/*.xml
            test/target/failsafe-reports/*.xml
            test/target/attempt-1/*/*.xml
          if-no-files-found: warn

