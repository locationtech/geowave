name: Tests

on:
  push:
    branches: [master]
  pull_request:
    # 'labeled' so that adding run-its to an open pull request actually starts
    # the integration matrix rather than waiting for the next push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Integration tests spin up real backends and take the bulk of the CI time, so
# they run on master, on demand, and on pull requests labelled 'run-its' --
# rather than on every push to every branch.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV_RESOURCES_VERSION: 1.7
  MAVEN_PROFILES: '""'
  IT_ONLY: true
  MAVEN_OPTS: "-XX:CompressedClassSpaceSize=256m -XX:+UseSerialGC -Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    name: Unit Tests
    env:
      IT_ONLY: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run
        run: ./.utility/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: warn

  # Non-blocking. The project targets Java 8 today; this is here so that the
  # work needed to move off it is visible before it is urgent.
  jdk-canary:
    runs-on: ubuntu-24.04
    name: Unit Tests on JDK 21 (informational)
    continue-on-error: true
    env:
      IT_ONLY: false
      # spotbugs 3.1.10 cannot load on JDK 9+, which would mask whatever this
      # job is actually meant to reveal. MAVEN_ARGS needs Maven 3.9+, which the
      # wrapper pins.
      MAVEN_ARGS: -Dspotbugs.skip
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run
        run: ./.utility/run-tests.sh

  python-tests:
    runs-on: ubuntu-24.04
    name: Python Tests
    env:
      IT_ONLY: false
      PYTHON_BUILD: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run
        run: ./.utility/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: python/src/main/python/test-report.xml
          if-no-files-found: warn

  integration-tests:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-its')
    runs-on: ubuntu-24.04
    name: ${{ matrix.profile }} Integration Tests
    strategy:
      fail-fast: false
      matrix:
        profile:
          - redis-it
          - rocksdb-it
          - accumulo-it-client
          - accumulo-it-server
          - hbase-it-client
          - hbase-it-server
          - dynamodb-it
          - filesystem-it
          - 'filesystem-it,secondary-index-it'
          - 'rocksdb-it,secondary-index-it'
          - 'accumulo-it-server,compatibility'
          - 'hbase-it-server,secondary-index-it'
        # cassandra-it is excluded for now: it is much slower than the other
        # lanes and was holding up the whole matrix. Run it on demand with
        # workflow_dispatch until that is addressed.
    env:
      IT_ONLY: true
      MAVEN_PROFILES: ${{ matrix.profile }}
      TEST_KERBEROS: ${{ matrix.test_kerberos }}
      RETRY_TESTS: ${{ matrix.retry_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # Not covered by setup-java's maven cache.
      - name: Cache downloaded test resources
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-other-${{ secrets.CACHE_ID }}
          restore-keys: ${{ runner.os }}-other-
          path: ~/.downloads

      - name: Run
        run: ./.utility/retry ./.utility/run-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-reports-${{ strategy.job-index }}
          path: test/target/failsafe-reports/*.xml
          if-no-files-found: warn
