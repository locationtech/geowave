# The integration tests' Log4j 2 configuration (log4j.configurationFile), which
# ServicesTestEnvironment also gives GeoServer as its logging profile
rootLogger.level = error
rootLogger.appenderRef.stdout.ref = stdout

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger - %msg%n
