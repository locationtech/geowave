# Deliberately empty. It makes GeoTools' CoordinateOperationFactoryUsingWKT an
# available EPSG operation authority, which GeoServer's GeoserverWKTOperationFactory
# (gs-main) requires on GeoTools 35 and gt-epsg-wkt does not provide. With no
# operations defined, transforms fall back as they do without gs-main, and a full
# EPSG database such as gt-epsg-hsql still takes precedence.
